name: pipeline-cd

on:
  push:
    branches:
      - main


permissions:                
  id-token: write                   #important! para o OIDC funcionar e permitir que o GitHub Actions assuma a role do AWS
  contents: read


jobs:
  job1:
    name: build_ecr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure AWS Credentials                        #Assume a role in AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::635096816538:role/GitHubActionsRepoApp
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag and Push image to Amazon ECR
        run: |
          docker build -t meu-website:v1.0 .
          docker tag meu-website:v1.0 635096816538.dkr.ecr.us-east-1.amazonaws.com/site_prod:v1.0
          docker push 635096816538.dkr.ecr.us-east-1.amazonaws.com/site_prod:v1.0


  job2:
    name: deploy_ec2
    needs: job1                                   #important! job2 roda depois de job1 terminar

    env:                                          #important! pra poder aceder aos secrects criados no github
      INSTANCE_KEY: ${{secrets.INSTANCE_KEY}}
      PUBLIC_IP: ${{secrets.PUBLIC_IP}}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy EC2 SSH
        run: |
          echo "$INSTANCE_KEY" > chave-site.pem
          chmod 400 chave-site.pem

          ssh -T -i chave-site.pem -o StrictHostKeyChecking=no ec2-user@$PUBLIC_IP << EOF
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 635096816538.dkr.ecr.us-east-1.amazonaws.com
            
            echo  "--- Pulling latest image from ECR..."
            docker pull 635096816538.dkr.ecr.us-east-1.amazonaws.com/site_prod:v1.0

            echo "--- Stopping and removing existing container (if any)..."
            docker stop site || true
            docker rm site || true

            echo "--- Running new container..."
            docker run -d -p 80:80 --name site 635096816538.dkr.ecr.us-east-1.amazonaws.com/site_prod:v1.0

            echo "--- Listing running containers..."
            docker ps

            echo "--- Deployment completed successfully!"
          EOF

          echo "--- Cleaning up..."
          rm chave-site.pem

