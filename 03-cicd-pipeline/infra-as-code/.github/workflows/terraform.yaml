name: Terraform CI/CD

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Executar o terraform apply?'
        required: true
        default: false
        type: boolean         #c

      plan_destroy:
        description: 'Planear a destruição do ambiente?'
        required: true
        default: false
        type: boolean            

      destroy:
        description: 'Destruir o ambiente?'
        required: true
        default: false
        type: boolean

permissions:                
  id-token: write                   #important! para o OIDC funcionar e permitir que o GitHub Actions assuma a role do AWS
  contents: read
  security-events: write            #ncessary for the checkov upload sarif results to github security tab

jobs:
  job1:
    name: Terraform CI/CD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 
        uses: actions/checkout@v7.0.1

      - name: Configure AWS Credentials                 #Assume a role in AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::635096816538:role/GitHubInfraRole
          aws-region: us-east-1

      - name: HashiCorp - Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      # --- LINTING ---
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6.3.1 
        with: 
          tflint_version: v0.50.0

      - name: Run TFLint
        run: |
          tflint --init
          tflint -f compact --minimum-failure-severity=error

      # --- SECURITY CHECKS (SAST) ---
      - name: Checkov GitHub Action
        uses: bridgecrewio/checkov-action@v12.1347.0
        with:
          framework: terraform
          output_format: sarif 
          output_file_path: results.sarif
          soft_fail: true            #Not fail the workflow if Checkov finds issues, just report them

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif


      # --- FLUXO NORMAL (Criar / Atualizar) ---
      - name: Terraform Plan
        if: ${{ !inputs.plan_destroy && !inputs.destroy }}
        run: terraform plan -out=tfplan.tfout

      - name: Terraform Apply
        if: ${{ inputs.apply && !inputs.plan_destroy && !inputs.destroy }}
        run: terraform apply -auto-approve tfplan.tfout

      # --- FLUXO DE DESTRUIÇÃO ---
      - name: Terraform Plan Destroy
        if: ${{ inputs.plan_destroy && !inputs.destroy }}
        run: terraform plan -destroy -out=tfdestroy.tfout

      - name: Terraform Destroy
        if: ${{ inputs.destroy }}
        run: terraform destroy -auto-approve           #executar o destroy sem pedir confirmação